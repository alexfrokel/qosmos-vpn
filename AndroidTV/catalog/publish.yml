name: Publish encrypted TV catalog

on:
  push:
    branches: [main]
    paths: [profiles/**, devices/**, publish.mjs, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qosmos-tv-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Encrypt and publish the catalog
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$work/key"
          unset MIRROR_DEPLOY_KEY
          curl -fsS https://api.github.com/meta | jq -er '.ssh_keys[] | "github.com " + .' > "$work/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $work/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/known_hosts"
          git clone --depth 1 --branch main git@github.com:alexfrokel/qosmos-tv-catalog.git "$work/mirror"
          node publish.mjs profiles devices "$work/mirror/catalog.json"
          git -C "$work/mirror" add -- catalog.json
          git -C "$work/mirror" -c user.name='Qosmos catalog' -c user.email='actions@users.noreply.github.com' commit -m 'Publish encrypted catalog'
          git -C "$work/mirror" push origin HEAD:main
