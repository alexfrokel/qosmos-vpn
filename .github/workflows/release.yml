name: macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version and architecture
        id: version
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' MacVPN/Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned upstream engines
        run: MacVPN/fetch-engines.sh "$RUNNER_TEMP/qosmos-engines"
      - name: Validate Kill Switch rules
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          print(KillSwitch.rules(endpoint: "192.0.2.10", port: 443, uid: 501, tunnel: "utun3"))
          print(KillSwitch.rules(endpoint: "2001:db8::10", port: 8443, uid: 501, tunnel: nil))
          SWIFT
          swiftc "$RUNNER_TEMP/main.swift" MacVPN/KillSwitch.swift MacVPN/SplitTunnel.swift -o "$RUNNER_TEMP/qosmos-rules"
          "$RUNNER_TEMP/qosmos-rules" | sudo /sbin/pfctl -n -a com.apple/000.QosmosVPN -f -
      - name: Build and archive
        shell: bash
        env:
          QOSMOS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export QOSMOS_ENGINE_DIR="$RUNNER_TEMP/qosmos-engines"
          export QOSMOS_BUILD_DIR="$RUNNER_TEMP/qosmos-build"
          export QOSMOS_UPDATE_SOURCE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/qosmos-update.json"
          MacVPN/build.sh
          mkdir -p dist
          ditto -c -k --keepParent "$QOSMOS_BUILD_DIR/Qosmos VPN.app" dist/Qosmos-VPN-macOS-arm64.zip
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["QOSMOS_VERSION"]
          tag = f"v{version}"
          repo = os.environ["GITHUB_REPOSITORY"]
          archive = Path("dist/Qosmos-VPN-macOS-arm64.zip")
          digest = hashlib.sha256()
          with archive.open("rb") as file:
              for chunk in iter(lambda: file.read(1024 * 1024), b""):
                  digest.update(chunk)
          Path("dist/qosmos-update.json").write_text(json.dumps({
              "version": version,
              "url": f"https://github.com/{repo}/releases/download/{tag}/Qosmos-VPN-macOS-arm64.zip",
              "sha256": digest.hexdigest(),
          }) + "\n")
          PY
          cp MacVPN/THIRD-PARTY.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: qosmos-macos
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qosmos-macos
          path: dist
      - name: Publish release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Qosmos VPN ${{ needs.build.outputs.version }}"
