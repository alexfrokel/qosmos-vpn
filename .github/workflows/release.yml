name: macOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [MacVPN/Info.plist]

concurrency:
  group: qosmos-macos-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare the app version with the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export QOSMOS_LATEST_TAG="$(gh release view --json tagName --jq .tagName)"
          python3 - <<'PY'
          import os, plistlib, re
          from pathlib import Path

          version = plistlib.loads(Path('MacVPN/Info.plist').read_bytes())['CFBundleShortVersionString']
          latest = os.environ['QOSMOS_LATEST_TAG'].removeprefix('v')
          for value in (version, latest):
              if not re.fullmatch(r'\d+\.\d+\.\d+', value):
                  raise SystemExit(f'Unexpected version: {value}')
          publish = tuple(map(int, version.split('.'))) > tuple(map(int, latest.split('.')))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'publish={str(publish).lower()}', file=output)
          PY

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check version and architecture
        shell: bash
        env:
          QOSMOS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(uname -m)" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' MacVPN/Info.plist)" = "$QOSMOS_VERSION"
      - name: Fetch pinned upstream engines
        run: MacVPN/fetch-engines.sh "$RUNNER_TEMP/qosmos-engines"
      - name: Validate Kill Switch rules
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          print(KillSwitch.rules(endpoint: "192.0.2.10", port: 443, uid: 501, tunnel: "utun3"))
          print(KillSwitch.rules(endpoint: "2001:db8::10", port: 8443, uid: 501, tunnel: nil))
          SWIFT
          swiftc "$RUNNER_TEMP/main.swift" MacVPN/KillSwitch.swift MacVPN/SplitTunnel.swift -o "$RUNNER_TEMP/qosmos-rules"
          "$RUNNER_TEMP/qosmos-rules" | sudo /sbin/pfctl -n -a com.apple/000.QosmosVPN -f -
      - name: Build and archive
        shell: bash
        env:
          QOSMOS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          export QOSMOS_ENGINE_DIR="$RUNNER_TEMP/qosmos-engines"
          export QOSMOS_UPDATE_SOURCE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/qosmos-update.json"
          mkdir -p dist
          bash MacVPN/build-installer.sh "$PWD/dist/Qosmos-VPN-macOS-arm64.pkg" "$PWD/dist/Qosmos-VPN-macOS-arm64.zip"
          /usr/bin/python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["QOSMOS_VERSION"]
          tag = f"v{version}"
          repo = os.environ["GITHUB_REPOSITORY"]
          archive = Path("dist/Qosmos-VPN-macOS-arm64.zip")
          digest = hashlib.sha256()
          with archive.open("rb") as file:
              for chunk in iter(lambda: file.read(1024 * 1024), b""):
                  digest.update(chunk)
          Path("dist/qosmos-update.json").write_text(json.dumps({
              "version": version,
              "url": f"https://github.com/{repo}/releases/download/{tag}/Qosmos-VPN-macOS-arm64.zip",
              "sha256": digest.hexdigest(),
          }) + "\n")
          PY
          cp MacVPN/THIRD-PARTY.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: qosmos-macos
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qosmos-macos
          path: dist
      - name: Publish release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          QOSMOS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$QOSMOS_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --latest \
            --title "Qosmos VPN $QOSMOS_VERSION"
